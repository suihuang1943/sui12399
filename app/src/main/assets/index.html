2>'; h+='<div class="card"><div class="f"><label>新增批注（user_note）</label><textarea id="noteBox" placeholder="记录考据心得、异文线索…">'+(c.user_note||'')+'</textarea></div><div class="btn-row" style="margin-top:12px"><button type="button" class="btn primary full" id="btnSave2">保存本次占例</button><button type="button" class="btn ghost" id="btnNote">保存批注</button><button type="button" class="btn ghost" id="btnCopy">复制卦信息</button><label class="btn ghost full" for="pg2">返回起卦</label></div></div>'; ('#resultBody').innerHTML=h; var b2=('#btnSave2'); if(b2) b2.onclick=saveCase; var bn=('#btnNote'); if(bn) bn.onclick=saveNote; var bc=$('#btnCopy'); if(bc) bc.onclick=copyGua; }

function copyGua(){ var c=CURRENT; if(!c){ alert('尚未起卦'); return; } var t='占事：'+c.ask+'\n时间：'+c.ts+'\n起卦：'+c.mode+'，动爻 '+c.dong+'\n本卦：'+guaName(c.upper,c.lower)+'\n互卦：'+guaName(c.hu.upper,c.hu.lower)+'\n变卦：'+guaName(c.bianUpper,c.bianLower)+'\n体卦：'+c.ti.name+' '+c.ti.wx+'（'+c.calc.tiW+'）\n用卦：'+c.yong.name+' '+c.yong.wx+'（'+c.calc.yongW+'）\n体用生克：'+c.calc.base+'\n版本：'+c.version; try{ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('卦信息已复制'); }catch(e){ alert('复制失败，请手动记录'); } }
var KEY='meihua_zhan_ji_lu';
function loadCases(){ try{ return JSON.parse(store.get(KEY)||'[]'); }catch(e){ return []; } }
function saveCases(a){ store.set(KEY,JSON.stringify(a)); }
function saveCase(){ if(!CURRENT){ alert('尚未起卦，请先「起卦演算」'); return; } var box=('#noteBox'); if(box&&box.value) CURRENT.user_note=box.value.replace(/^\s+|\s+$/g,''); var list=loadCases(); CURRENT.id=(new Date()).getTime(); list.unshift(JSON.parse(JSON.stringify(CURRENT))); saveCases(list); alert('占例已保存至本地（zhan_ji_lu）'); }
function renderHistory(){ var box=('#historyList'); if(!box) return; var kw=('#sKeyword')?('#sKeyword').value.replace(/^\s+|\s+$/g,''):''; var gua=('#sGua')?('#sGua').value.replace(/^\s+|\s+$/g,''):''; var from=('#sFrom')?('#sFrom').value:''; var to=('#sTo')?$('#sTo').value:''; var all=loadCases(),list=[],i,x,d; for(i=0;i<all.length;i++){ x=all[i]; if(kw&&(x.ask||'').indexOf(kw)<0&&(x.user_note||'').indexOf(kw)<0) continue; if(gua&&guaName(x.upper,x.lower).indexOf(gua)<0) continue; d=(x.ts||'').slice(0,10).replace(///g,'-'); if(from&&d&&d<from) continue; if(to&&d&&d>to) continue; list.push(x); } if(!list.length){ box.innerHTML='<div class="empty">暂无匹配的占例记录<br>占例记录表（zhan_ji_lu）为空或检索条件无结果</div>'; return; } var h=''; for(i=0;i<list.length;i++){ x=list[i]; h+='<div class="rec" data-id="'+x.id+'"><div class="t">'+x.ts+' · 动爻 '+x.dong+'</div><div class="ask">'+x.ask+'</div><div><span class="chip">本卦 '+guaName(x.upper,x.lower)+'</span><span class="chip">变卦 '+guaName(x.bianUpper,x.bianLower)+'</span><span class="chip v">'+x.version+'</span></div></div>'; } box.innerHTML=h; }
function openCase(id){ var all=loadCases(); for(var i=0;i<all.length;i++){ if(String(all[i].id)===String(id)){ CURRENT=all[i]; renderResult(); var r=document.getElementById('pg3'); if(r) r.checked=true; return; } } }
function bind(id,fn,evName){ var el=document.getElementById(id); if(el) el.addEventListener(evName||'click',fn,false); }
bind('btnCast',function(ev){ try{ if(!doCast()) ev.preventDefault(); }catch(e){ ev.preventDefault(); window.onerror(e.message); } });
bind('btnReset',function(){ var ids=['askText','personInfo','waiYingText','numA','numB','ziText','ziCount','biHua']; for(var i=0;i<ids.length;i++) if(('#'+ids[i])) ('#'+ids[i]).value=''; var sels=['fangWei','changDi','weather','waiYingWx']; for(i=0;i<sels.length;i++) if(('#'+sels[i])) ('#'+sels[i]).selectedIndex=0; if(('#fangWeiCustom')){ ('#fangWeiCustom').value=''; ('#fangWeiCustom').style.display='none'; } syncTime(); });
bind('btnSave',saveCase);
bind('btnSearch',renderHistory);
bind('btnClear',function(){ var ids=['sKeyword','sGua','sFrom','sTo']; for(var i=0;i<ids.length;i++) if(('#'+ids[i])) ('#'+ids[i]).value=''; renderHistory(); });
bind('dt',syncTime,'change');
bind('lunarMonth',function(){ var m=parseInt(this.value,10); if(('#yueLing')) ('#yueLing').value=ZHI[(m+1)%12]; },'change');
bind('fangWei',function(){ var cw=('#fangWeiCustom'); if(cw) cw.style.display=(this.value==='__custom')?'block':'none'; },'change');
bind('ziText',function(){ if(('#ziCount')) ('#ziCount').value=this.value.replace(/\s/g,'').length; },'input');
bind('dictVersion',function(){ var box=$('#diffBox'); if(box) box.innerHTML='暂无异文记录 · 数据由版本考据注释表导入后展示（当前版本：'+this.value+'）'; },'change');
(function(){ var hl=document.getElementById('historyList'); if(!hl) return; hl.addEventListener('click',function(ev){ var el=ev.target; while(el&&el!==hl&&!(el.getAttribute&&el.getAttribute('data-id'))) el=el.parentNode; if(el&&el.getAttribute&&el.getAttribute('data-id')) openCase(el.getAttribute('data-id')); },false); })();
try{ syncTime(); renderHistory(); }catch(e){ window.onerror(e.message); }
})();
</script>
